version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - gocognit
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
  settings:
    errcheck:
      check-type-assertions: true
    gocognit:
      min-complexity: 20
    gosec:
      excludes: [G104]
    govet:
      enable-all: true
      disable: [fieldalignment]
    nolintlint:
      require-explanation: true
      require-specific: true
    usetesting:
      context-background: true
      context-todo: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gocognit
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
    goimports:
      local-prefixes:
        - github.com/isimonetti-dev/ticketing-go
    golines:
      max-len: 120

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
