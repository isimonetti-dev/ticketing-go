name: ticketing-go

services:
  api:
    image: ${API_IMAGE:-ticketing-go/api:local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    stop_grace_period: 25s
